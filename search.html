<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Reference Search</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 🎨 Include Pagefind UI Native Styling -->
  <link href="/_pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="/_pagefind/pagefind-ui.js"></script>
  
  <style>
    :root { 
      --primary: #0284c7; 
      --text: #0f172a; 
      --bg: #f8fafc; 
      --card-bg: #ffffff; 
      --border: #e2e8f0; 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.5; }
    .search-wrapper { max-width: 750px; margin: 0 auto; background: var(--card-bg); padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid var(--border); }
    
    /* 📋 Header Flexbox Navigation Layout */
    .search-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border); 
      padding-bottom: 1.5rem; 
      margin-bottom: 2rem; 
    }
    .header-title h1 { font-size: 1.75rem; font-weight: 700; color: #1e293b; letter-spacing: -0.02em; }
    .header-title p { color: #64748b; font-size: 0.9rem; margin-top: 0.25rem; }
    
    /* 🏠 Modern Home Button Action Pill */
    .home-btn { 
      display: inline-flex; 
      align-items: center; 
      gap: 0.5rem; 
      background: #ffffff; 
      color: #334155; 
      padding: 0.6rem 1.1rem; 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 0.9rem; 
      border-radius: 8px; 
      border: 1px solid #cbd5e1;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }
    .home-btn:hover { 
      background: #f1f5f9; 
      color: #0f172a;
      border-color: #94a3b8;
    }
    .home-btn:active { transform: scale(0.98); }
    
    /* Pagefind Input Core Overrides to match your master index */
    .pagefind-ui__search-input {
      font-family: 'Inter', sans-serif !important;
      border-radius: 8px !important;
    }
    .pagefind-ui__result-link {
      color: #0369a1 !important;
      font-weight: 600 !important;
    }
    
    @media (max-width: 640px) {
      .search-header { flex-direction: column-reverse; align-items: stretch; gap: 1rem; }
      .home-btn { width: 100%; justify-content: center; }
      .header-title { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="search-wrapper">
    
    <!-- 🏠 Dynamic Navigation Header -->
    <header class="search-header">
      <div class="header-title">
        <h1>🩺 Library Search Engine</h1>
        <p>Instant across-the-board protocol lookup</p>
      </div>
      <a href="/index.html" class="home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Go Home</span>
      </a>
    </header>

    <!-- 🔍 Primary Search Mounting Frame -->
    <div id="search-ui"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      new PagefindUI({ 
        element: "#search-ui",
        showSubResults: true,    // Displays matching h2 sections inside protocols directly
        showImages: false,       // Disables image boxes to keep search cards clean
        translations: {
          placeholder: "Type symptoms, specific warnings, or emergency topics..."
        }
      });
    });
  </script>
</body>
</html>
